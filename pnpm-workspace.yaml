packages:
  - "api"
  - "ui"

allowBuilds:
  bcrypt: true
  esbuild: true
  unrs-resolver: true

minimumReleaseAge: 4320

# Lets `pnpm deploy` reuse this lockfile instead of resolving the deployed package's dependencies again
injectWorkspacePackages: true

# Save new and upgraded dependencies with exact versions instead of ^ ranges
savePrefix: ""
