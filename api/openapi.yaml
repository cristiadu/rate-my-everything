    Pick_RatedItem.Exclude_keyofRatedItem.item-or-user__:
      properties:
        id:
          type: number
          format: double
        rating:
          type: number
          format: double
        userId:
          type: number
          format: double
          description: Id of the user who gave the rating, so clients can group a user's
            ratings without loading the user.
        ratedAt:
          type: string
          format: date-time
          description: When the rating was given; a user can rate the same item many times.
        notes:
          type: string
          nullable: true
      required:
        - id
        - rating
        - userId
        - ratedAt
        - notes
      type: object
      description: From T, pick a set of properties whose keys are in the union K
    Omit_RatedItem.item-or-user_:
      $ref: "#/components/schemas/Pick_RatedItem.Exclude_keyofRatedItem.item-or-user_\
        _"
      description: Construct a type with the properties of T except for those in type K.
    Pick_Item.Exclude_keyofItem.category-or-ratings-or-attributes__:
      properties:
        id:
          type: number
          format: double
        name:
          type: string
        description:
          type: string
        imageUrl:
          type: string
