    HealthStatus:
      enum:
        - healthy
        - unhealthy
        - offline
      type: string
      x-enum-varnames:
        - HEALTHY
        - UNHEALTHY
        - OFFLLINE
    ComponentHealth:
      properties:
        status:
          $ref: "#/components/schemas/HealthStatus"
        message:
          type: string
      required:
        - status
      type: object
      additionalProperties: true
    Health:
      properties:
        status:
          $ref: "#/components/schemas/HealthStatus"
        uptime:
          type: number
          format: double
        timestamp:
          type: string
        message:
          type: string
        services:
          properties: {}
          additionalProperties:
            $ref: "#/components/schemas/ComponentHealth"
          type: object
      required:
        - status
        - uptime
        - timestamp
      type: object
      additionalProperties: true
    ChangeRequestTarget:
      description: Kind of shared data a change request proposes to change.
      enum:
        - item
        - category
      type: string
      x-enum-varnames:
        - ITEM
        - CATEGORY
    ChangeRequestAction:
      description: What a change request proposes to do with its target.
      enum:
        - create
        - update
        - delete
      type: string
      x-enum-varnames:
        - CREATE
        - UPDATE
        - DELETE
    ChangeRequestChanges:
      anyOf:
        - $ref: "#/components/schemas/ItemInput"
        - $ref: "#/components/schemas/CategoryInput"
      description: Fields a change request proposes, in the same shape the items or
        categories API accepts.
    ChangeRequestStatus:
      description: Where a change request is in moderation.
      enum:
        - pending
        - approved
        - rejected
      type: string
      x-enum-varnames:
        - PENDING
        - APPROVED
        - REJECTED
    Pick_ChangeRequest.Exclude_keyofChangeRequest.requestedBy-or-reviewedBy__:
      properties:
        id:
          type: number
          format: double
        createdAt:
          type: string
          format: date-time
        targetType:
          $ref: "#/components/schemas/ChangeRequestTarget"
        action:
          $ref: "#/components/schemas/ChangeRequestAction"
        targetId:
          type: number
          format: double
          nullable: true
          description: Id of the item or category being changed; empty when creating one.
        targetName:
          type: string
          nullable: true
          description: Name of the target when the request was made, so moderators can
            tell what it is about.
        changes:
          allOf:
            - $ref: "#/components/schemas/ChangeRequestChanges"
          nullable: true
        status:
          $ref: "#/components/schemas/ChangeRequestStatus"
        reviewNote:
          type: string
          nullable: true
        reviewedAt:
          type: string
          format: date-time
          nullable: true
      required:
