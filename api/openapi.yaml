components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    APIError:
      type: object
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        status:
          $ref: "#/components/schemas/HttpStatusCode"
        message:
          type: string
      required:
        - code
        - status
        - message
    AttributeInput:
      type: object
      properties:
        name:
          type: string
        valueType:
          $ref: "#/components/schemas/AttributeValueType"
      required:
        - name
        - valueType
      description: Fields accepted when creating or updating an attribute.
    AttributeResponse:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
        valueType:
          $ref: "#/components/schemas/AttributeValueType"
      required:
        - id
        - name
        - valueType
      description: An attribute as the API returns it, without its categories and values.
    AttributeValueInput:
      type: object
      properties:
        attributeId:
          type: number
        value:
          type: string
      required:
        - attributeId
        - value
      description: One value an item holds for an attribute of its category.
    AttributeValueRecordInput:
      type: object
      properties:
        item:
          type: object
          properties:
            id:
              type: number
          required:
            - id
          additionalProperties: false
        attribute:
          type: object
          properties:
            id:
              type: number
          required:
            - id
          additionalProperties: false
        value:
          type: string
      required:
        - attribute
        - item
        - value
      description: Fields accepted by the attribute values endpoints, with the item and attribute given by id.
    AttributeValueResponse:
      type: object
      properties:
        id:
          type: number
        value:
          type: string
      required:
        - id
        - value
      description: An attribute value as the attribute values endpoints return it, without its item and attribute.
    AttributeValueType:
      type: string
      enum:
        - string
        - number
        - boolean
        - date
      description: Kinds of value an attribute holds.
      x-enum-varnames:
        - STRING
        - NUMBER
        - BOOLEAN
        - DATE
    CategoryInput:
      type: object
      properties:
        attributeIds:
          type: array
          items:
            type: number
        name:
          type: string
        description:
          type:
            - string
            - "null"
      description: Fields accepted when creating or updating a category, with linked attributes given by id.
    CategoryResponse:
      type: object
      properties:
        attributes:
          type: array
          items:
            $ref: "#/components/schemas/AttributeResponse"
        id:
          type: number
        name:
          type: string
        description:
          type:
            - string
            - "null"
      required:
        - attributes
        - id
        - name
      description: A category as the API returns it, with its attributes.
    CategorySummary:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
        description:
          type:
            - string
            - "null"
      required:
        - id
        - name
      description: A category without the attributes and items linked to it.
    CommentAuthor:
      type: object
      properties:
        id:
          type: number
        username:
          type: string
      required:
        - id
        - username
      description: Author of a comment; only their id and username are returned.
    CommentInput:
      type: object
      properties:
        body:
          type: string
      required:
        - body
      additionalProperties: false
      description: Fields accepted when posting a comment.
    CommentResponse:
      type: object
      properties:
        item:
          type: object
          properties:
            id:
              type: number
          required:
            - id
          additionalProperties: false
        user:
          $ref: "#/components/schemas/CommentAuthor"
        id:
          type: number
        body:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - body
        - createdAt
        - id
        - item
        - user
      description: A comment as the API returns it, with the id of its item and its author.
    ComponentHealth:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/HealthStatus"
        message:
          type: string
      required:
        - status
    ErrorCode:
      type: string
      enum:
        - UNAUTHORIZED
        - FORBIDDEN
        - MISSING_CREDENTIALS
        - INVALID_CREDENTIALS
        - VALIDATION_ERROR
        - NOT_FOUND
        - RESOURCE_NOT_FOUND
        - RESOURCE_ALREADY_EXISTS
        - INTERNAL_ERROR
        - EXTERNAL_SERVICE_ERROR
        - SERVICE_UNAVAILABLE
      x-enum-varnames:
        - UNAUTHORIZED
        - FORBIDDEN
        - MISSING_CREDENTIALS
        - INVALID_CREDENTIALS
        - VALIDATION_ERROR
        - NOT_FOUND
        - RESOURCE_NOT_FOUND
        - RESOURCE_ALREADY_EXISTS
        - INTERNAL_ERROR
        - EXTERNAL_SERVICE_ERROR
        - SERVICE_UNAVAILABLE
    Health:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/HealthStatus"
        uptime:
          type: number
        timestamp:
          type: string
        message:
          type: string
        services:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ComponentHealth"
      required:
        - status
        - uptime
        - timestamp
    HealthStatus:
      type: string
      enum:
        - healthy
        - unhealthy
        - offline
    HttpStatusCode:
      type: number
      enum:
        - 200
        - 201
        - 202
