        - value
      type: object
      additionalProperties: true
    ItemInput:
      allOf:
        - $ref: "#/components/schemas/Partial_Pick_Item.name-or-description-or-imageUrl__"
        - properties:
            attributeValues:
              items:
                $ref: "#/components/schemas/AttributeValueInput"
              type: array
            categoryId:
              type: number
              format: double
          type: object
      description: Fields accepted when creating or updating an item; attribute values
        replace the item's current ones.
    CategoryResponse:
      allOf:
        - $ref: "#/components/schemas/CategorySummary"
        - properties:
            attributes:
              items:
                $ref: "#/components/schemas/AttributeResponse"
              type: array
          required:
            - attributes
          type: object
      description: A category as the API returns it, with its attributes.
    Partial_Pick_Category.name-or-description__:
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
      type: object
      description: Make all properties in T optional
    CategoryInput:
      allOf:
        - $ref: "#/components/schemas/Partial_Pick_Category.name-or-description__"
