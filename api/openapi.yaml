        without its item and attribute.
    Pick_Attribute.name-or-valueType_:
      properties:
        name:
          type: string
        valueType:
          $ref: "#/components/schemas/AttributeValueType"
      required:
        - name
        - valueType
      type: object
      description: From T, pick a set of properties whose keys are in the union K
    AttributeInput:
      $ref: "#/components/schemas/Pick_Attribute.name-or-valueType_"
