        id:
          type: number
          format: double
      required:
        - id
      type: object
      description: From T, pick a set of properties whose keys are in the union K
    Pick_Attribute.id_:
      properties:
        id:
          type: number
          format: double
      required:
        - id
      type: object
      description: From T, pick a set of properties whose keys are in the union K
    AttributeValueRecordInput:
      allOf:
        - $ref: "#/components/schemas/Pick_AttributeValue.value_"
        - properties:
            attribute:
              $ref: "#/components/schemas/Pick_Attribute.id_"
            item:
              $ref: "#/components/schemas/Pick_Item.id_"
          required:
            - attribute
            - item
          type: object
      description: Fields accepted by the attribute values endpoints, with the item
        and attribute given by id.
    Partial_AttributeInput_:
      properties:
        name:
          type: string
        valueType:
          $ref: "#/components/schemas/AttributeValueType"
      type: object
      description: Make all properties in T optional
    ItemAttributeValue:
