openapi: 3.2.0
info:
  title: Rate My Everything API
  version: 1.0.0
  description: Rate interests, group them in categories described by attributes, and discuss them.
servers:
  - url: /api
tags:
  - name: Attributes
  - name: Categories
  - name: Comments
  - name: Health
  - name: Imports
  - name: Items
  - name: Login
  - name: Ratings
  - name: Users
security:
  - bearerAuth: []
paths:
  /login:
    post:
      operationId: login
      summary: Signs in and returns a bearer token
      tags:
        - Login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserTokenResponse"
        "400":
          description: Username or password is missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "401":
          description: Username or password is wrong
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "500":
          description: Something unexpected failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
  /login/register:
    post:
      operationId: register
