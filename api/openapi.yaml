openapi: 3.1.0
components:
  examples: {}
  headers: {}
  parameters: {}
  requestBodies: {}
  responses: {}
  schemas:
    ErrorCode:
      enum:
        - UNAUTHORIZED
        - FORBIDDEN
        - MISSING_CREDENTIALS
        - INVALID_CREDENTIALS
        - VALIDATION_ERROR
        - NOT_FOUND
        - RESOURCE_NOT_FOUND
        - RESOURCE_ALREADY_EXISTS
        - INTERNAL_ERROR
        - EXTERNAL_SERVICE_ERROR
        - SERVICE_UNAVAILABLE
      type: string
      x-enum-varnames:
        - UNAUTHORIZED
        - FORBIDDEN
        - MISSING_CREDENTIALS
        - INVALID_CREDENTIALS
        - VALIDATION_ERROR
        - NOT_FOUND
        - RESOURCE_NOT_FOUND
        - RESOURCE_ALREADY_EXISTS
        - INTERNAL_ERROR
        - EXTERNAL_SERVICE_ERROR
        - SERVICE_UNAVAILABLE
    HttpStatusCode:
      type: number
      enum:
        - 200
        - 201
        - 202
        - 204
        - 400
        - 401
        - 403
        - 404
        - 422
        - 429
        - 500
        - 502
