      description: Construct a type with the properties of T except for those in type K.
    UserResponse:
      $ref: "#/components/schemas/Omit_User.password-or-ratedItems_"
      description: A user as the API returns it, without the password hash.
    Pick_User.username-or-email-or-password_:
      properties:
        username:
          type: string
        password:
          type: string
        email:
          type: string
      required:
        - username
