      description: An attribute as the API returns it, without its categories and values.
    Pick_AttributeValue.id-or-value_:
      properties:
        id:
          type: number
          format: double
        value:
          type: string
      required:
        - id
        - value
      type: object
      description: From T, pick a set of properties whose keys are in the union K
    AttributeValueResponse:
      $ref: "#/components/schemas/Pick_AttributeValue.id-or-value_"
