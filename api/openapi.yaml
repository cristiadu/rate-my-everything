      description: Construct a type with the properties of T except for those in type K.
    Pick_Category.Exclude_keyofCategory.attributes-or-items__:
      properties:
        id:
          type: number
          format: double
        name:
          type: string
        description:
          type: string
          nullable: true
      required:
