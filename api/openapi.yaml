          type: string
        description:
          type: string
        imageUrl:
          type: string
          nullable: true
          description: Picture shown next to the item in rankings.
      required:
        - name
        - description
      type: object
      description: From T, pick a set of properties whose keys are in the union K
    ImportedItemType:
      type: string
      description: Provider-specific display label for an imported result, such as
        Artist, Album, Song, or Video.
    ImportedItem:
      allOf:
        - $ref: "#/components/schemas/Pick_Item.name-or-description-or-imageUrl_"
        - properties:
            type:
              $ref: "#/components/schemas/ImportedItemType"
          required:
            - type
          type: object
      description: An interest found on an external service, with the item fields it
        fills in.
    ImportSource:
      description: External services that interests can be imported from.
      enum:
        - lastfm
        - youtube
      type: string
      x-enum-varnames:
        - LASTFM
        - YOUTUBE
    Pick_User.username-or-email-or-roles_:
      properties:
        username:
          type: string
        email:
          type: string
        roles:
          items:
            $ref: "#/components/schemas/UserRole"
          type: array
      required:
        - username
        - email
        - roles
      type: object
      description: From T, pick a set of properties whose keys are in the union K
    Partial_Pick_User.password__:
      properties:
        password:
          type: string
      type: object
      description: Make all properties in T optional
    UserInput:
      allOf:
        - $ref: "#/components/schemas/Pick_User.username-or-email-or-roles_"
        - $ref: "#/components/schemas/Partial_Pick_User.password__"
      description: Fields accepted when creating or updating a user; without a
        password, an update keeps the current one.
    Partial_UserInput_:
      properties:
        username:
          type: string
        email:
          type: string
        roles:
          items:
            $ref: "#/components/schemas/UserRole"
          type: array
        password:
          type: string
      type: object
      description: Make all properties in T optional
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
info:
  title: Rate My Everything API
  version: 1.0.0
  description: Rate interests, keep personal rankings and discuss them.
  license:
    name: ISC
  contact:
    name: Cristiano Faustino
paths:
  /ratings:
    get:
      operationId: getRatings
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/RatedItemResponse"
                type: array
        "401":
          description: The bearer token is missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "403":
          description: The signed-in user may not call this operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "500":
          description: Something unexpected failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
      summary: Lists every rating
      tags:
        - Ratings
      security:
        - bearerAuth:
            - user
            - admin
      parameters: []
    post:
      operationId: createRating
      responses:
        "201":
          description: Rating created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RatedItemResponse"
        "400":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "401":
          description: The bearer token is missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "403":
          description: The signed-in user may not call this operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "500":
          description: Something unexpected failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
      summary: Rates an item as the signed-in user
      tags:
        - Ratings
      security:
        - bearerAuth:
            - user
            - admin
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewRatingInput"
  /ratings/user/{user_id}:
    get:
      operationId: getRatingsByUser
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/RatedItemResponse"
                type: array
        "401":
          description: The bearer token is missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "403":
          description: The signed-in user may not call this operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "500":
          description: Something unexpected failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
      summary: Lists the ratings of a user
      tags:
        - Ratings
      security:
        - bearerAuth:
            - user
