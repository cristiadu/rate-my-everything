      additionalProperties: true
    Pick_User.username-or-password_:
      properties:
        username:
          type: string
        password:
          type: string
      required:
        - username
        - password
      type: object
      description: From T, pick a set of properties whose keys are in the union K
    LoginInput:
      $ref: "#/components/schemas/Pick_User.username-or-password_"
