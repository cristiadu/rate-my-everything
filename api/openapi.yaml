        tems__"
      description: Construct a type with the properties of T except for those in type K.
    CategorySummary:
      $ref: "#/components/schemas/Omit_Category.attributes-or-items_"
      description: A category without the attributes and items linked to it.
    ItemSummary:
      allOf:
        - $ref: "#/components/schemas/Omit_Item.category-or-ratings-or-attributes_"
        - properties:
            category:
