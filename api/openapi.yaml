      description: From T, pick a set of properties whose keys are in the union K
    Omit_ChangeRequest.requestedBy-or-reviewedBy_:
      $ref: "#/components/schemas/Pick_ChangeRequest.Exclude_keyofChangeRequest.reque\
        stedBy-or-reviewedBy__"
      description: Construct a type with the properties of T except for those in type K.
    ChangeRequestResponse:
      allOf:
        - $ref: "#/components/schemas/Omit_ChangeRequest.requestedBy-or-reviewedBy_"
        - properties:
            reviewedBy:
              allOf:
                - $ref: "#/components/schemas/UserSummary"
              nullable: true
            requestedBy:
              $ref: "#/components/schemas/UserSummary"
          required:
            - reviewedBy
            - requestedBy
          type: object
