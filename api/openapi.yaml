    Partial_RatingInput_:
      properties:
        rating:
          type: number
          format: double
        notes:
          type: string
          nullable: true
      type: object
      description: Make all properties in T optional
    AttributeValueType:
      description: Kinds of value an attribute holds.
      enum:
        - string
        - number
        - boolean
        - date
      type: string
      x-enum-varnames:
        - STRING
        - NUMBER
        - BOOLEAN
        - DATE
    Pick_Attribute.Exclude_keyofAttribute.categories-or-values__:
      properties:
        id:
          type: number
          format: double
        name:
          type: string
        valueType:
          $ref: "#/components/schemas/AttributeValueType"
      required:
        - id
        - name
        - valueType
      type: object
      description: From T, pick a set of properties whose keys are in the union K
    Omit_Attribute.categories-or-values_:
      $ref: "#/components/schemas/Pick_Attribute.Exclude_keyofAttribute.categories-or\
        -values__"
      description: Construct a type with the properties of T except for those in type K.
    AttributeResponse:
