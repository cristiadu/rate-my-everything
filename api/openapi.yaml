openapi: 3.1.0
components:
  examples: {}
  headers: {}
  parameters: {}
  requestBodies: {}
  responses: {}
  schemas:
    ErrorCode:
      enum:
        - UNAUTHORIZED
        - FORBIDDEN
        - MISSING_CREDENTIALS
        - INVALID_CREDENTIALS
        - VALIDATION_ERROR
        - NOT_FOUND
        - RESOURCE_NOT_FOUND
        - RESOURCE_ALREADY_EXISTS
        - INTERNAL_ERROR
        - EXTERNAL_SERVICE_ERROR
        - SERVICE_UNAVAILABLE
        - TOO_MANY_REQUESTS
      type: string
      x-enum-varnames:
        - UNAUTHORIZED
        - FORBIDDEN
        - MISSING_CREDENTIALS
        - INVALID_CREDENTIALS
        - VALIDATION_ERROR
        - NOT_FOUND
        - RESOURCE_NOT_FOUND
        - RESOURCE_ALREADY_EXISTS
        - INTERNAL_ERROR
        - EXTERNAL_SERVICE_ERROR
        - SERVICE_UNAVAILABLE
        - TOO_MANY_REQUESTS
    HttpStatusCode:
      type: number
      enum:
        - 200
        - 201
        - 202
        - 204
        - 400
        - 401
        - 403
        - 404
        - 422
        - 429
        - 500
        - 502
        - 503
    APIError:
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        status:
          $ref: "#/components/schemas/HttpStatusCode"
        message:
          type: string
      required:
        - code
        - status
        - message
      type: object
      additionalProperties: true
    UserRole:
      enum:
        - admin
        - moderator
        - user
      type: string
      x-enum-varnames:
        - ADMIN
        - MODERATOR
        - USER
    UserResponse:
      description: A user as the API returns it, without the password hash.
      properties:
        id:
          type: integer
          format: int32
          example: 5
        username:
          type: string
          example: ada
        email:
          type: string
          example: ada@example.com
        roles:
          items:
            $ref: "#/components/schemas/UserRole"
          type: array
      required:
        - id
        - username
        - email
        - roles
      type: object
      additionalProperties: true
    ResourceId:
      type: integer
      format: int32
      example: 12
      description: Numeric id of a stored resource, such as an item, an attribute or a
        rating.
      minimum: 1
    UserInput:
      description: Fields accepted when creating or updating a user; without a
        password, an update keeps the current one.
      properties:
        username:
          type: string
          example: ada
        email:
          type: string
          example: ada@example.com
        roles:
          items:
            $ref: "#/components/schemas/UserRole"
          type: array
        password:
          type: string
          description: Plain-text password when sent to the API; stored only as a hash and
            never returned.
          example: correct-horse-battery-staple
      required:
        - username
        - email
        - roles
      type: object
      additionalProperties: true
    UserUpdate:
      description: Fields accepted when changing a user; fields left out keep their value.
      properties:
        username:
          type: string
          example: ada
        email:
          type: string
          example: ada@example.com
        roles:
          items:
            $ref: "#/components/schemas/UserRole"
          type: array
        password:
          type: string
          description: Plain-text password when sent to the API; stored only as a hash and
            never returned.
          example: correct-horse-battery-staple
      type: object
      additionalProperties: true
    CategorySummary:
      description: A category without the attributes and items linked to it.
      properties:
        id:
          type: integer
          format: int32
          example: 2
        name:
          type: string
          example: Books
        description:
          type: string
          nullable: true
          example: Novels, comics and non-fiction.
        color:
          type: string
          nullable: true
          description: Hex color the category is shown in, picked when it is created; null
            for categories made before colors existed.
          example: "#3E8ED0"
          pattern: ^#[0-9a-fA-F]{6}$
      required:
        - id
        - name
      type: object
      additionalProperties: true
    ItemSummary:
      description: An item as the API returns it with its category.
      properties:
        id:
          type: integer
          format: int32
          example: 12
        name:
          type: string
          example: Dune
        description:
          type: string
          example: Frank Herbert's novel about the desert planet Arrakis.
        imageUrl:
          type: string
          nullable: true
          description: Picture shown next to the item in rankings.
          example: https://example.com/images/dune.jpg
        category:
          $ref: "#/components/schemas/CategorySummary"
      required:
        - id
        - name
        - description
        - category
      type: object
      additionalProperties: true
    RatedItemResponse:
      description: A rating as the API returns it, with its item and the item's category.
      properties:
        id:
          type: integer
          format: int32
          example: 40
        rating:
          type: number
          format: double
          description: Grade from 0 to 10.
          example: 8.5
          minimum: 0
          maximum: 10
        userId:
          type: integer
          format: int32
          description: Id of the user who gave the rating, so clients can group a user's
            ratings without loading the user.
          example: 5
        ratedAt:
          type: string
          format: date-time
          description: When the rating was given; a user can rate the same item many times.
        notes:
          type: string
          nullable: true
          example: Slow start, brilliant ending.
        item:
          $ref: "#/components/schemas/ItemSummary"
      required:
        - id
        - rating
        - userId
        - ratedAt
        - notes
        - item
      type: object
      additionalProperties: true
    RankingScope:
      description: "Whose grade a rankings list is about: the signed-in user's
        personal grade, or everyone's collective grade."
      enum:
        - mine
        - all
      type: string
      x-enum-varnames:
        - MINE
        - ALL
    RatingQuery:
      description: Query parameters that narrow down the ratings list.
      properties:
        name:
          type: string
          description: Part of the item's name, in any case.
          example: dune
        categoryId:
          items:
            $ref: "#/components/schemas/ResourceId"
          type: array
          description: Categories the item must be in; repeat the parameter for several.
        attribute:
          items:
            type: string
          type: array
          description: >-
            Attribute values the item must hold, each as
            `<attributeId>:<value>`; repeat the parameter for several.

            Text attributes match when they contain the value, other types when
            they equal it.
          example:
            - 3:Frank Herbert
        minGrade:
          type: number
          format: double
          description: "Lowest grade: the signed-in user's own grade for the `mine` scope,
            the collective grade for `all`."
          example: 6.5
          minimum: 0
          maximum: 10
        maxGrade:
          type: number
          format: double
          description: "Highest grade: the signed-in user's own grade for the `mine`
            scope, the collective grade for `all`."
          example: 9
          minimum: 0
          maximum: 10
        scope:
          $ref: "#/components/schemas/RankingScope"
          description: Whose grade the range applies to. `mine` also keeps only the items
            the signed-in user rated. Defaults to `all`.
      type: object
      additionalProperties: true
    NewRatingInput:
      description: Fields accepted when rating an item.
      properties:
        rating:
          type: number
          format: double
          description: Grade from 0 to 10.
          example: 8.5
          minimum: 0
          maximum: 10
        notes:
          type: string
          nullable: true
          example: Slow start, brilliant ending.
        item_id:
          type: integer
          format: int32
          description: Id of the item being rated.
          example: 12
      required:
        - rating
        - item_id
      type: object
      additionalProperties: true
    RatingUpdate:
      description: Fields accepted when changing a rating; fields left out keep their value.
      properties:
        rating:
          type: number
          format: double
          description: Grade from 0 to 10.
          example: 8.5
          minimum: 0
          maximum: 10
        notes:
          type: string
          nullable: true
          example: Slow start, brilliant ending.
      type: object
      additionalProperties: true
    UserSummary:
      description: A user reduced to their id and username, as comments and change
        requests return them.
      properties:
        id:
          type: integer
          format: int32
          example: 5
        username:
          type: string
          example: ada
      required:
        - id
        - username
      type: object
      additionalProperties: true
    ChangeRequestTarget:
      description: Kind of shared data a change request proposes to change.
      enum:
        - item
        - category
      type: string
      x-enum-varnames:
        - ITEM
        - CATEGORY
    ChangeRequestAction:
      description: What a change request proposes to do with its target.
      enum:
        - create
        - update
        - delete
      type: string
      x-enum-varnames:
        - CREATE
        - UPDATE
        - DELETE
    AttributeValueInput:
      description: One value an item holds for an attribute of its category.
      properties:
        attributeId:
          type: integer
          format: int32
          example: 3
        value:
          type: string
          example: "1965"
      required:
        - attributeId
        - value
      type: object
      additionalProperties: true
    ItemInput:
      description: Fields accepted when creating or updating an item; attribute values
        replace the item's current ones.
      properties:
        name:
          type: string
          example: Dune
        description:
          type: string
          example: Frank Herbert's novel about the desert planet Arrakis.
        imageUrl:
          type: string
          nullable: true
          description: Picture shown next to the item in rankings.
          example: https://example.com/images/dune.jpg
        categoryId:
          type: integer
          format: int32
          example: 2
        attributeValues:
          items:
            $ref: "#/components/schemas/AttributeValueInput"
          type: array
      type: object
      additionalProperties: true
    CategoryInput:
      description: Fields accepted when creating or updating a category, with linked
        attributes given by id.
      properties:
        name:
          type: string
          example: Books
        description:
          type: string
          nullable: true
          example: Novels, comics and non-fiction.
        color:
          type: string
          nullable: true
          description: Hex color the category is shown in, picked when it is created; null
            for categories made before colors existed.
          example: "#3E8ED0"
          pattern: ^#[0-9a-fA-F]{6}$
        attributeIds:
          items:
            $ref: "#/components/schemas/ResourceId"
          type: array
          description: Ids of the attributes that describe the category's items.
          example:
            - 3
            - 4
      type: object
      additionalProperties: true
    ChangeRequestChanges:
      anyOf:
        - $ref: "#/components/schemas/ItemInput"
        - $ref: "#/components/schemas/CategoryInput"
      description: Fields a change request proposes, in the same shape the items or
        categories API accepts.
    ChangeRequestStatus:
      description: Where a change request is in moderation.
      enum:
        - pending
        - approved
        - rejected
      type: string
      x-enum-varnames:
        - PENDING
        - APPROVED
        - REJECTED
    ChangeRequestResponse:
      description: A change request as the API returns it, with the requester and
        reviewer reduced to their id and username.
      properties:
        id:
          type: integer
          format: int32
          example: 7
        targetType:
          $ref: "#/components/schemas/ChangeRequestTarget"
        action:
          $ref: "#/components/schemas/ChangeRequestAction"
        targetId:
          type: integer
          format: int32
          nullable: true
          description: Id of the item or category being changed; empty when creating one.
          example: 12
        targetName:
          type: string
          nullable: true
          description: Name of the target when the request was made, so moderators can
            tell what it is about.
          example: Abbey Road
        changes:
          allOf:
            - $ref: "#/components/schemas/ChangeRequestChanges"
          nullable: true
        status:
          $ref: "#/components/schemas/ChangeRequestStatus"
        reviewNote:
          type: string
          nullable: true
          example: Thanks, the year was wrong.
        createdAt:
          type: string
          format: date-time
        reviewedAt:
          type: string
          format: date-time
          nullable: true
        requestedBy:
          $ref: "#/components/schemas/UserSummary"
        reviewedBy:
          allOf:
            - $ref: "#/components/schemas/UserSummary"
          nullable: true
      required:
        - id
        - targetType
        - action
        - targetId
        - targetName
        - changes
        - status
        - reviewNote
        - createdAt
        - reviewedAt
        - requestedBy
        - reviewedBy
      type: object
      additionalProperties: true
    ChangeRequestReview:
      description: Fields accepted when a moderator approves or rejects a change request.
      properties:
        reviewNote:
          type: string
          example: Thanks, the year was wrong.
      type: object
      additionalProperties: true
    SessionUser:
      description: The signed-in user as the session token carries it.
      properties:
        id:
          type: integer
          format: int32
          example: 5
        username:
          type: string
          example: ada
        roles:
          items:
            $ref: "#/components/schemas/UserRole"
          type: array
      required:
        - id
        - username
        - roles
      type: object
      additionalProperties: true
    UserTokenResponse:
      description: "A signed-in session: the JWT to send as a bearer token and the
        user it belongs to."
      properties:
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpZCI6NSwidXNlcm5hbWUiOiJhZGEifQ.signature
        user:
          $ref: "#/components/schemas/SessionUser"
      required:
        - token
        - user
      type: object
      additionalProperties: true
    LoginInput:
      description: Credentials sent to sign in.
      properties:
        username:
          type: string
          example: ada
        password:
          type: string
          description: Plain-text password when sent to the API; stored only as a hash and
            never returned.
          example: correct-horse-battery-staple
      required:
        - username
        - password
      type: object
      additionalProperties: true
    RegisterInput:
      description: Fields accepted when signing up; every new account gets the user
        role, and only admins grant others.
      properties:
        username:
          type: string
          example: ada
        email:
          type: string
          example: ada@example.com
        password:
          type: string
          description: Plain-text password when sent to the API; stored only as a hash and
            never returned.
          example: correct-horse-battery-staple
      required:
        - username
        - email
        - password
      type: object
      additionalProperties: true
    AttributeValueType:
      description: Kinds of value an attribute holds.
      enum:
        - string
        - number
        - boolean
        - date
        - currency
        - percentage
        - url
        - email
        - duration
      type: string
      x-enum-varnames:
        - STRING
        - NUMBER
        - BOOLEAN
        - DATE
        - CURRENCY
        - PERCENTAGE
        - URL
        - EMAIL
        - DURATION
    AttributeResponse:
      description: An attribute as the API returns it, without its categories and values.
      properties:
        id:
          type: integer
          format: int32
          example: 3
        name:
          type: string
          example: Year published
        valueType:
          $ref: "#/components/schemas/AttributeValueType"
        currencyCode:
          type: string
          nullable: true
          description: ISO 4217 code of the currency the amounts are in; required for
            currency attributes, empty for other value types.
          example: USD
      required:
        - id
        - name
        - valueType
      type: object
      additionalProperties: true
    ItemAttributeValue:
      description: A value an item holds for one attribute, returned with that attribute.
      properties:
        id:
          type: integer
          format: int32
          example: 21
        value:
          type: string
          example: "1965"
        attribute:
          $ref: "#/components/schemas/AttributeResponse"
      required:
        - id
        - value
        - attribute
      type: object
      additionalProperties: true
    ItemResponse:
      description: An item as the API returns it, with its category and the values of
        that category's attributes.
      properties:
        id:
          type: integer
          format: int32
          example: 12
        name:
          type: string
          example: Dune
        description:
          type: string
          example: Frank Herbert's novel about the desert planet Arrakis.
        imageUrl:
          type: string
          nullable: true
          description: Picture shown next to the item in rankings.
          example: https://example.com/images/dune.jpg
        category:
          $ref: "#/components/schemas/CategorySummary"
        attributes:
          items:
            $ref: "#/components/schemas/ItemAttributeValue"
          type: array
      required:
        - id
        - name
        - description
        - category
        - attributes
      type: object
      additionalProperties: true
    ImportedItemType:
      type: string
      description: Provider-specific display label for an imported result, such as
        Artist, Album, Song, or Video.
    ImportedItem:
      description: An interest found on an external service, with the item fields it
        fills in.
      properties:
        name:
          type: string
          example: Dune
        description:
          type: string
          example: Frank Herbert's novel about the desert planet Arrakis.
        imageUrl:
          type: string
          nullable: true
          description: Picture shown next to the item in rankings.
          example: https://example.com/images/dune.jpg
        type:
          $ref: "#/components/schemas/ImportedItemType"
      required:
        - name
        - description
        - type
      type: object
      additionalProperties: true
    ImportSource:
      description: External services that interests can be imported from.
      enum:
        - lastfm
        - youtube
      type: string
      x-enum-varnames:
        - LASTFM
        - YOUTUBE
    HealthStatus:
      enum:
        - healthy
        - unhealthy
      type: string
      x-enum-varnames:
        - HEALTHY
        - UNHEALTHY
    ComponentHealth:
      properties:
        status:
          $ref: "#/components/schemas/HealthStatus"
        message:
          type: string
      required:
        - status
      type: object
      additionalProperties: true
    Health:
      properties:
        status:
          $ref: "#/components/schemas/HealthStatus"
        uptime:
          type: number
          format: double
        timestamp:
          type: string
        message:
          type: string
        services:
          properties: {}
          additionalProperties:
            $ref: "#/components/schemas/ComponentHealth"
          type: object
      required:
        - status
        - uptime
        - timestamp
      type: object
      additionalProperties: true
    ItemReference:
      description: An item given by its id.
      properties:
        id:
          type: integer
          format: int32
          example: 12
      required:
        - id
      type: object
      additionalProperties: true
    CommentResponse:
      description: A comment as the API returns it, with the id of its item and its author.
      properties:
        id:
          type: integer
          format: int32
          example: 31
        createdAt:
          type: string
          format: date-time
        body:
          type: string
          description: Text of the comment.
          example: The remaster sounds much better than the original pressing.
          maxLength: 2000
        item:
          $ref: "#/components/schemas/ItemReference"
        user:
          $ref: "#/components/schemas/UserSummary"
      required:
        - id
        - createdAt
        - body
        - item
        - user
      type: object
      additionalProperties: true
    CommentInput:
      description: Fields accepted when posting a comment.
      properties:
        body:
          type: string
          description: Text of the comment.
          example: The remaster sounds much better than the original pressing.
          maxLength: 2000
      required:
        - body
      type: object
      additionalProperties: true
    ChangeRequestInput:
      description: Fields accepted when a user submits a change request.
      properties:
        targetType:
          $ref: "#/components/schemas/ChangeRequestTarget"
        action:
          $ref: "#/components/schemas/ChangeRequestAction"
        targetId:
          type: integer
          format: int32
          description: Id of the item or category being changed; left out when creating one.
          example: 12
        changes:
          $ref: "#/components/schemas/ChangeRequestChanges"
      required:
        - targetType
        - action
      type: object
      additionalProperties: true
    CategoryResponse:
      description: A category as the API returns it, with its attributes.
      properties:
        id:
          type: integer
          format: int32
          example: 2
        name:
          type: string
          example: Books
        description:
          type: string
          nullable: true
          example: Novels, comics and non-fiction.
        color:
          type: string
          nullable: true
          description: Hex color the category is shown in, picked when it is created; null
            for categories made before colors existed.
          example: "#3E8ED0"
          pattern: ^#[0-9a-fA-F]{6}$
        attributes:
          items:
            $ref: "#/components/schemas/AttributeResponse"
          type: array
      required:
        - id
        - name
        - attributes
      type: object
      additionalProperties: true
    AttributeValueResponse:
      description: An attribute value as the attribute values endpoints return it,
        without its item and attribute.
      properties:
        id:
          type: integer
          format: int32
          example: 21
        value:
          type: string
          example: "1965"
      required:
        - id
        - value
      type: object
      additionalProperties: true
    AttributeInput:
      description: Fields accepted when creating an attribute.
      properties:
        name:
          type: string
          example: Year published
        valueType:
          $ref: "#/components/schemas/AttributeValueType"
        currencyCode:
          type: string
          nullable: true
          description: ISO 4217 code of the currency the amounts are in; required for
            currency attributes, empty for other value types.
          example: USD
      required:
        - name
        - valueType
      type: object
      additionalProperties: true
    AttributeReference:
      description: An attribute given by its id.
      properties:
        id:
          type: integer
          format: int32
          example: 3
      required:
        - id
      type: object
      additionalProperties: true
    AttributeValueRecordInput:
      description: Fields accepted by the attribute values endpoints, with the item
        and attribute given by id.
      properties:
        value:
          type: string
          example: "1965"
        item:
          $ref: "#/components/schemas/ItemReference"
        attribute:
          $ref: "#/components/schemas/AttributeReference"
      required:
        - value
        - item
        - attribute
      type: object
      additionalProperties: true
    AttributeUpdate:
      description: Fields accepted when changing an attribute; fields left out keep
        their value.
      properties:
        name:
          type: string
          example: Year published
        valueType:
          $ref: "#/components/schemas/AttributeValueType"
        currencyCode:
          type: string
          nullable: true
          description: ISO 4217 code of the currency the amounts are in; required for
            currency attributes, empty for other value types.
          example: USD
      type: object
      additionalProperties: true
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
info:
  title: Rate My Everything API
  version: 1.0.0
  description: Rate interests, keep personal rankings and discuss them.
  license:
    name: ISC
  contact:
    name: Cristiano Faustino
paths:
  /users:
    get:
      operationId: getUsers
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/UserResponse"
                type: array
        "401":
          description: The bearer token is missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
              examples:
                Example 1:
                  value:
                    code: UNAUTHORIZED
                    status: 401
                    message: Missing or invalid authorization header
        "403":
          description: The signed-in user may not call this operation or change this
            resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
              examples:
                Example 1:
                  value:
                    code: FORBIDDEN
                    status: 403
                    message: You do not have permission to access this resource
        "429":
          description: The client sent too many requests in the current rate limit window
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
              examples:
                Example 1:
                  value:
                    code: TOO_MANY_REQUESTS
                    status: 429
                    message: Too many requests, try again later
          headers:
            X-RateLimit-Limit:
              schema:
                type: string
              description: Requests one client may make in each 15 minute window.
              required: true
            X-RateLimit-Remaining:
              schema:
                type: string
              description: Requests left in the current window.
              required: true
            X-RateLimit-Reset:
              schema:
                type: string
              description: When the current window ends, in seconds since the Unix epoch.
              required: true
            Retry-After:
              schema:
                type: string
              description: Seconds to wait before sending another request.
              required: true
        "500":
          description: Something unexpected failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
              examples:
                Example 1:
                  value:
                    code: INTERNAL_ERROR
                    status: 500
                    message: An internal server error occurred
      summary: Lists every user
      tags:
        - Users
      security:
        - bearerAuth:
            - admin
      parameters: []
    post:
