name: Publish on Github Pages
on:
  push:
    branches:
      - main
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup PNPM
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # 6.0.10
        with:
          package_json_file: package.json
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 #7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
      - name: Set git user
        run: |
          git fetch origin main
          git config --global user.name "$(git log -1 --pretty=format:'%an' origin/main)"
          git config --global user.email "$(git log -1 --pretty=format:'%ae' origin/main)"
      - name: Install Dependencies
        run: pnpm install
      - name: Build
        run: pnpm build
      - name: Release
        env:
          ACTIONS_DEPLOY_KEY: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm release
