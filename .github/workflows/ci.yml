# This workflow will do a clean install of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Project's CI

on:
  push:
    branches:
      - main
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Project's CI
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
    - name: Setup PNPM
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # 6.1.0
      with:
        package_json_file: package.json
        run_install: false

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # 7.0.0
      with:
        node-version-file: '.nvmrc'
        cache: 'pnpm'
        cache-dependency-path: pnpm-lock.yaml
    - run: pnpm install
    # Pull requests must commit the spec that `pnpm openapi` generates, since nothing pushes it to main afterwards.
    - name: Check the OpenAPI spec is up to date
      run: |
        pnpm --filter @cristiadu/rate-my-everything-api openapi
        git diff --exit-code api/openapi.yaml || (echo "::error file=api/openapi.yaml::api/openapi.yaml is out of date; run pnpm openapi and commit it" && exit 1)
    - run: pnpm lint
    - run: pnpm test
    - run: pnpm build
    - run: pnpm knip
