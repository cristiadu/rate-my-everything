name: Publish OpenAPI spec
# Regenerates api/openapi.yaml on each pull request that changes the API and commits it onto the pull request's
# branch, since main is protected. Commits pushed with GITHUB_TOKEN do not start new workflow runs.
on:
  pull_request:
    branches:
      - main
    paths:
      - 'api/src/**'
      - 'api/tsoa.json'
      - 'api/package.json'
permissions:
  contents: write
concurrency:
  group: publish-openapi-${{ github.head_ref }}
  cancel-in-progress: true
jobs:
  publish-openapi:
    # GITHUB_TOKEN cannot push to a fork's branch.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Setup PNPM
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # 6.1.0
        with:
          package_json_file: package.json
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 #7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
      - name: Set git user
        run: |
          git config --global user.name "$(git log -1 --pretty=format:'%an')"
          git config --global user.email "$(git log -1 --pretty=format:'%ae')"
      - name: Install Dependencies
        run: pnpm install
      - name: Generate OpenAPI spec
        run: pnpm --filter @cristiadu/rate-my-everything-api openapi
      - name: Commit the spec to the pull request's branch when it changed
        run: |
          git add api/openapi.yaml
          git diff --cached --quiet || (git commit -m "docs(api): regenerate OpenAPI spec" && git push)
