name: Publish OpenAPI spec
on:
  push:
    branches:
      - main
    paths:
      - 'api/src/**'
      - 'api/tsoa.json'
      - 'api/package.json'
permissions:
  contents: read
jobs:
  publish-openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
      - name: Setup PNPM
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # 6.1.0
        with:
          package_json_file: package.json
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 #7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
      - name: Install Dependencies
        run: pnpm install
      - name: Generate OpenAPI spec
        run: pnpm --filter @cristiadu/rate-my-everything-api openapi
      # main is protected, so the workflow publishes the spec as a run artifact instead of pushing it.
      - name: Publish the spec
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # 7.0.2
        with:
          name: openapi-spec
          path: api/openapi.yaml
          if-no-files-found: error
